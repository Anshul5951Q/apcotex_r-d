[alembic]
# Path to the alembic migration scripts
script_location = alembic

# Prepend sys.path so "app.*" imports resolve correctly
prepend_sys_path = .

# Template for new migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone used for 'Create Date' comment in migration files
timezone = UTC

# Disable SQLAlchemy URL here — it is set dynamically in alembic/env.py
# from app.core.config.settings.DATABASE_URL
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
